<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b1a">
  <title>Kiko's Quest</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="384" height="240" aria-label="Kiko's Quest game screen"></canvas>
    <div id="touch" class="hidden" aria-hidden="true">
      <div class="pad dpad">
        <button data-action="left">&#9664;</button>
        <button data-action="down">&#9660;</button>
        <button data-action="right">&#9654;</button>
      </div>
      <div class="pad actions">
        <button data-action="run" class="b">B</button>
        <button data-action="jump" class="a">A</button>
      </div>
      <button data-action="pause" class="sys">II</button>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/font.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/items.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
